<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vista previa</title>
<link rel="preconnect" href="https://images.pexels.com">
<style>
/* ==========================================================
   Diseños de ejemplo · a todo el ancho de la pantalla
   ========================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth;overflow-x:clip;--e:cubic-bezier(.22,1,.36,1);--g:clamp(20px,4.5vw,84px);--line:color-mix(in srgb,var(--text) 11%,transparent)}
body{background:var(--bg);color:var(--text);font-family:var(--fb);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:1em;height:1em;flex:none}
.w{padding:0 var(--g)}
h1,h2,h3,.lg,.pp,.datos b,.op-sum b,.ft-marca{font-family:var(--fd);font-weight:var(--hw);text-transform:var(--tt);letter-spacing:-.02em;line-height:1}
[data-tema=filo] :is(h1,h2,.lg,.ft-marca),[data-tema=pulso] :is(h1,h2,.lg,.ft-marca){letter-spacing:.005em}
h1 em,h2 em{font-style:italic;color:var(--accent)}
.h2{font-size:clamp(34px,5.4vw,84px);max-width:16ch}
.sh{margin-bottom:clamp(36px,4vw,64px)}
.sec{padding:clamp(80px,9vw,150px) 0}
.sec.sin-pie{padding-bottom:0}
.sec.tight{padding:clamp(40px,4vw,64px) 0}
.sec.alt{background:var(--surface)}
.hdato{font-size:16px;font-weight:600;color:var(--text);opacity:.82;margin-top:-6px}

/* ---------- Animaciones ---------- */
.anim .rv{opacity:0;transform:translateY(34px);transition:opacity 1s var(--e),transform 1.1s var(--e)}
.anim .rv.in{opacity:1;transform:none}
.anim .rvi{clip-path:inset(18% 0 0 0);opacity:.001;transition:clip-path 1.4s var(--e),opacity .6s}
.anim .rvi .ph img{transform:scale(1.25);transition:transform 1.8s var(--e),opacity .8s}
.anim .rvi.in{clip-path:inset(0 0 0 0);opacity:1}
.anim .rvi.in .ph img{transform:scale(1)}
.pw{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .02em .12em;margin:-.06em -.02em -.12em}
.pw > *{display:inline-block;transform:translateY(110%);transition:transform .7s var(--e)}
.parte.in .pw > *{transform:none}
@media (prefers-reduced-motion:reduce){.kb img,.ct,.badge,.pin,.wa-float::before{animation:none!important}}

/* ---------- Botones ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 30px;border-radius:var(--radius);font-weight:600;font-size:15px;white-space:nowrap;position:relative;overflow:hidden;isolation:isolate;
  transition:transform .4s var(--e),box-shadow .4s var(--e),background .3s,color .3s,border-color .3s}
.b svg{font-size:18px;transition:transform .4s var(--e)}
.b:hover svg{transform:translateX(4px)}
.b:active{transform:scale(.97)}
.b1{background:var(--accent);color:var(--ink)}
.b1::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--text);transform:translateY(101%);transition:transform .5s var(--e)}
.b1:hover{color:var(--bg)}
.b1:hover::before{transform:none}
.b2{border:1.5px solid color-mix(in srgb,currentColor 30%,transparent)}
.b2:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.hero.img .b2:hover,.cta.conimg .b2:hover{background:#fff;color:#111;border-color:#fff}
.b.sm{height:44px;padding:0 22px;font-size:14px}
[data-tema=calma] .b,[data-tema=brasa] .b,[data-tema=kiosko] .b{border-radius:999px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:38px}

/* ---------- Fotos (degradado mientras cargan) ---------- */
.ph{position:relative;width:100%;height:100%;overflow:hidden;
  background:color-mix(in srgb,var(--text) 8%,var(--surface));animation:brillo 1.4s ease-in-out infinite alternate}
.ph:has(img.ok){animation:none}
@keyframes brillo{to{background-color:color-mix(in srgb,var(--text) 13%,var(--surface))}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s var(--e),transform 1.2s var(--e)}
.ph img.ok{opacity:1}
.kb img.ok{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.15) translate(-1.5%,-1%)}}
.par img{transform:scale(1.14);will-change:transform}

/* ---------- Navegación ---------- */
.nv{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);transition:background .4s,border-color .4s,color .4s}
.nv.over{position:fixed;left:0;right:0;background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff}
.nv.over.solid,.nv.over.menu{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--line);color:var(--text)}
.nv .w{display:flex;align-items:center;gap:34px;height:78px}
.lg{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nl{display:flex;gap:32px;margin-left:auto;font-size:15px;font-weight:500}
.nl a{opacity:.75;position:relative;transition:opacity .25s}
.nl a::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--e)}
.nl a:hover{opacity:1}.nl a:hover::after{transform:scaleX(1);transform-origin:left}
.nv-r{display:flex;align-items:center;gap:10px}
.cart{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;border:1px solid var(--line)}
.cart i{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--ink);font:700 11px/20px var(--fb);font-style:normal;text-align:center}
.cart.bump{animation:bump .5s var(--e)}
@keyframes bump{40%{transform:scale(1.2)}}
.nv-menu{display:none;width:46px;height:46px;border-radius:50%;place-items:center;font-size:22px;border:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.mnav{position:fixed;inset:78px 0 auto;z-index:29;display:grid;gap:4px;padding:14px var(--g) 28px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.35);
  transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .45s var(--e),opacity .3s}
.mnav.open{transform:none;opacity:1;pointer-events:auto}
.mnav a:not(.b){padding:15px 0;font-size:22px;font-family:var(--fd);border-bottom:1px solid var(--line)}
.mnav .b{margin-top:16px}

/* ---------- Portada con foto a pantalla completa ---------- */
.hero{position:relative;overflow:hidden}
.hero h1{font-size:clamp(52px,8.6vw,150px)}
.hero p{font-size:clamp(16px,1.35vw,20px);color:var(--muted);max-width:560px;margin-top:26px}
.hero.img{min-height:clamp(620px,100vh,1100px);display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding-top:140px}
.mini .hero.img{min-height:800px}
.hbg{position:absolute;inset:0}
.hbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.1) 35%,rgba(0,0,0,.3) 62%,rgba(0,0,0,.8)),radial-gradient(ellipse at 10% 90%,rgba(0,0,0,.55),transparent 60%)}
.hero.img .hc{position:relative;z-index:1;padding-bottom:clamp(40px,6vw,90px)}
.hero.img h1{max-width:12ch}
.hero.img p{color:rgba(255,255,255,.85)}
.hero.img .b2{color:#fff}
.hstats{position:relative;z-index:1;display:flex;align-items:center;gap:clamp(18px,3vw,48px);padding:22px var(--g);border-top:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:15px;font-weight:500}
.hstats span{display:inline-flex;align-items:center;gap:10px}
.hstats svg{color:var(--accent);font-size:19px}
.hscroll{margin-left:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:20px;animation:baja 2.4s var(--e) infinite}
@keyframes baja{50%{transform:translateY(6px)}}
.hc > .kick,.hc > p,.hc > .btns,.hb{animation:sube 1.1s var(--e) both}
.hc > p{animation-delay:.25s}.hc > .btns,.hb{animation-delay:.38s}
@keyframes sube{from{opacity:0;transform:translateY(28px)}}
.mini .hc > *,.mini .hb,.sin-anim .hc > *{animation:none}

/* Portada partida: foto pegada al borde derecho */
.hero.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:clamp(600px,calc(100vh - 78px),1000px)}
.mini .hero.split{min-height:740px}
.hero.split .hc{align-self:center;padding:70px clamp(28px,4vw,72px) 70px var(--g)}
.hero.split .hv{position:relative;min-height:100%}
.hv .ph,.par-img .ph,.proy .ph,.cta-bg{position:absolute;inset:0;width:auto;height:auto}
.badge{position:absolute;z-index:2;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--text);padding:14px 20px 14px 14px;border-radius:calc(var(--radius) + 4px);border:0;animation:flota 6s ease-in-out infinite}
.badge > svg{width:26px;height:26px;flex:none;color:var(--accent)}
.badge b{display:block;font-size:17px;line-height:1.2}
.badge span{font-size:13px;color:var(--muted)}
.bd0{left:clamp(16px,3vw,48px);bottom:clamp(20px,5vw,64px)}
.bd1{right:clamp(16px,3vw,48px);top:clamp(20px,5vw,64px);animation-delay:-3s}
@keyframes flota{50%{transform:translateY(-10px)}}
.mini .badge{animation:none}
[data-tema=calma] .hero.split .hv .ph{inset:28px var(--g) 0 0;border-radius:400px 400px 0 0}

/* Portada editorial */
.hero.big{padding:clamp(60px,7vw,110px) 0 0}
.hero.big h1{font-size:clamp(60px,12.5vw,240px);letter-spacing:-.045em;line-height:.92}
.hb{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-top:30px}
.hb p{margin-top:0}
.hb .btns{margin-top:0}
.hv.wide{position:relative;height:clamp(340px,62vw,880px);margin-top:clamp(40px,5vw,80px)}
.mini .hv.wide{height:620px}

/* ---------- Cinta ---------- */
.cinta{overflow:hidden;background:var(--accent);color:var(--ink);padding:22px 0}
.ct{display:flex;flex-wrap:wrap;justify-content:center;width:auto;padding:0 var(--g)}
.ct span{display:inline-flex;align-items:center;gap:22px;padding:4px 22px 4px 0;font-family:var(--fd);font-weight:var(--hw);text-transform:var(--tt);font-size:clamp(16px,2.2vw,30px);white-space:nowrap;line-height:1}
.ct span::after{content:"·";opacity:.5}
@keyframes cinta{to{transform:translateX(-33.333%)}}
.mini .ct{animation:none}

/* ---------- Bloques de dos mitades (texto + foto pegada al borde) ---------- */
.par-sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:0;align-items:stretch}
.par-txt{padding:clamp(80px,9vw,150px) clamp(28px,4.5vw,90px) clamp(80px,9vw,150px) var(--g);align-self:center}
.par-img{position:relative;min-height:clamp(420px,52vw,900px)}
.par-img .ph{position:absolute;inset:0}
.sobre .par-txt{padding-left:clamp(28px,4.5vw,90px);padding-right:var(--g)}
.sobre.solo{grid-template-columns:1fr}
.etq{position:absolute;left:24px;bottom:24px;display:inline-flex;align-items:center;gap:8px;background:var(--bg);color:var(--text);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600}
.etq svg{color:var(--accent)}

/* Lista de precios */
.lista.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px}
.lista.multi .grupo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0 26px 22px;overflow:hidden}
.g-img{position:relative;margin:0 -26px 22px;height:230px;overflow:hidden}
.grupo h3{font-size:26px;color:var(--accent);margin-bottom:6px}
.li{display:flex;align-items:baseline;gap:14px;padding:20px 0;border-bottom:1px solid var(--line);transition:padding .4s var(--e),color .3s}
.li:hover{padding-left:10px}
.li b{font-weight:600;font-size:17px}
.li small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:3px}
.li i{flex:1;border-bottom:1.5px dotted color-mix(in srgb,var(--text) 25%,transparent);transform:translateY(-4px)}
.li span{font-family:var(--fd);font-size:23px;color:var(--accent);white-space:nowrap}

/* Galería a sangre */
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,clamp(200px,24vw,440px));gap:6px}
.g{position:relative;overflow:hidden;cursor:zoom-in}
.g0{grid-column:span 2;grid-row:span 2}
.g::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.45));opacity:0;transition:opacity .5s}
.g-ic{position:absolute;z-index:1;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:19px;transform:scale(.6);opacity:0;transition:transform .5s var(--e),opacity .4s}
@media (hover:hover){.g:hover img{transform:scale(1.06)!important}.g:hover::after{opacity:1}.g:hover .g-ic{transform:none;opacity:1}}

/* Opiniones */
.op-h{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:clamp(36px,4vw,64px)}
.op-h .sh{margin-bottom:0}
.op-sum{display:flex;align-items:center;gap:16px;padding:18px 24px;border-radius:calc(var(--radius) + 6px);background:var(--bg);border:1px solid var(--line)}
.op-sum b{font-size:52px}
.op-sum small{display:block;color:var(--muted);font-size:13px}
.stars{display:inline-flex;gap:2px;color:#f5b301}
.stars svg{width:17px;height:17px;fill:currentColor}
.stars.sm svg{width:12px;height:12px}
.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.op{padding:36px 32px 30px;border-radius:var(--radius);background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;gap:28px;transition:transform .5s var(--e)}
@media (hover:hover){.op:hover{transform:translateY(-4px)}}
.q{font-size:32px;color:var(--accent)}
.op blockquote{font-size:clamp(17px,1.4vw,21px);line-height:1.45;font-weight:500}
.op figcaption{display:flex;align-items:center;gap:12px}
.op figcaption b{display:block;font-size:15px}
.op figcaption small{color:var(--muted);font-size:12.5px}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--accent);color:var(--ink)}
.av1{background:color-mix(in srgb,var(--accent) 30%,var(--text));color:var(--bg)}
.av2{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--text)}

/* Información y mapa pegado al borde */
.info .sh{margin-bottom:24px}
.estado{margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-size:13.5px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulso 2s infinite}
.pill.si{color:#16a34a;background:rgba(22,163,74,.12)}
.pill.no{color:#dc2626;background:rgba(220,38,38,.1)}
@keyframes pulso{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 8px transparent}}
.horario div{display:flex;justify-content:space-between;gap:16px;padding:15px 12px;margin:0 -12px;border-bottom:1px solid var(--line);border-radius:10px}
.horario span{color:var(--muted)}
.horario b{font-weight:600;text-align:right}
.horario .hoy{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:transparent}
.horario .hoy span{color:var(--text);font-weight:600}
.horario .hoy span::after{content:" · hoy";color:var(--accent)}
.dir{display:flex;align-items:center;gap:8px;margin-top:24px;font-weight:600}
.dir svg{color:var(--accent)}
.info .btns{margin-top:24px}
.mapa{position:relative;overflow:hidden;min-height:clamp(420px,46vw,760px);background:color-mix(in srgb,var(--surface) 70%,var(--accent));
  background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:64px 64px}
.calle{position:absolute;background:color-mix(in srgb,var(--bg) 88%,transparent);box-shadow:0 0 0 1px var(--line)}
.c1{left:-10%;right:-10%;top:52%;height:26px;transform:rotate(-12deg)}
.c2{top:-10%;bottom:-10%;left:38%;width:18px;transform:rotate(18deg)}
.c3{left:-10%;right:-10%;top:22%;height:12px;transform:rotate(8deg);opacity:.7}
.pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);font-size:60px;color:var(--accent);filter:drop-shadow(0 10px 14px rgba(0,0,0,.3));animation:salta 2.6s var(--e) infinite}
.pin svg{fill:color-mix(in srgb,var(--accent) 30%,transparent)}
@keyframes salta{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-116%)}}
.mapa-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,16px);background:var(--bg);color:var(--text);font-weight:700;font-size:14px;padding:7px 14px;border-radius:99px;box-shadow:0 10px 24px -8px rgba(0,0,0,.3);white-space:nowrap}
.mini .pin{animation:none}

/* Llamada final a sangre */
.cta{position:relative;overflow:hidden;background:var(--accent);color:var(--ink);text-align:center;isolation:isolate;min-height:clamp(440px,64vh,720px);display:grid;place-items:center;padding:100px 0}
.mini .cta{min-height:560px}
.cta.conimg{color:#fff;background:#111}
.cta-bg{position:absolute!important;inset:0;z-index:-2}
.cta.conimg::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.68))}
.cta-in{display:flex;flex-direction:column;align-items:center;gap:16px}
.cta h2{font-size:clamp(42px,8vw,132px);max-width:14ch;line-height:.95}
.cta p{opacity:.88;font-size:clamp(17px,1.4vw,20px);margin-bottom:14px}
.cta:not(.conimg) .b1{background:var(--ink);color:var(--accent)}

/* Ventajas */
.ventajas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.v{display:flex;gap:16px;align-items:flex-start;padding:28px clamp(16px,2vw,36px)}
.v:first-child{border-left:0;padding-left:0}
.ve{flex:none;display:grid;place-items:center;font-size:26px;color:var(--accent);margin-top:2px;transition:transform .45s var(--e)}
@media (hover:hover){.v:hover .ve{transform:rotate(-8deg) scale(1.08)}}
.v small{font-size:12px;color:var(--muted);letter-spacing:.1em}
.v b{display:block;margin:0 0 4px;font-size:20px}
.v p{color:var(--text);opacity:.78;font-size:16px;line-height:1.5}

/* Productos */
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.4vw,24px)}
@media (min-width:1300px){.prods{grid-template-columns:repeat(4,minmax(0,1fr))}}
.prod-img{position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;background:var(--surface)}
@media (hover:hover){.prod:hover img{transform:scale(1.06)}}
.tag{position:absolute;top:14px;left:14px;z-index:2;background:var(--text);color:var(--bg);font-style:normal;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px}
.add{position:absolute;z-index:2;left:12px;right:12px;bottom:12px;height:48px;border-radius:99px;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;
  transform:translateY(130%);transition:transform .5s var(--e),background .3s,color .3s}
.add svg{font-size:18px}
@media (hover:hover){.prod:hover .add{transform:none}}
@media (hover:none){.add{transform:none;left:auto;width:48px;padding:0}.add span{display:none}}
.add:hover{background:var(--accent);color:var(--ink)}
.add.ok{background:#16a34a;color:#fff}
.pi{display:flex;justify-content:space-between;gap:10px;padding:16px 4px 4px}
.pi b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi span{color:var(--muted);font-weight:500;white-space:nowrap}

/* Proyectos a sangre */
.proys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.proy{position:relative;display:block;height:clamp(320px,38vw,700px);overflow:hidden}
.proy.ancho{grid-column:span 2;height:clamp(360px,46vw,860px)}
.proy .ph{position:absolute;inset:0}
.proy-i{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:18px;padding:clamp(20px,3vw,44px);color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7))}
.proy-i small{font-size:13px;opacity:.7;padding-bottom:.5em}
.proy-i b{font-family:var(--fd);font-size:clamp(28px,4vw,64px);font-weight:400;line-height:1}
.proy-i em{font-style:normal;opacity:.8;margin-left:auto;white-space:nowrap;padding-bottom:.4em}
.proy-i span{flex:none;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-size:22px;transform:rotate(-45deg) scale(.6);opacity:0;transition:transform .5s var(--e),opacity .4s}
@media (hover:hover){.proy:hover img{transform:scale(1.05)!important}.proy:hover .proy-i span{transform:rotate(-45deg);opacity:1}}

/* Sobre */
.txt{font-size:clamp(17px,1.5vw,21px);color:var(--muted);max-width:560px}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:40px}
.datos div{padding:24px 18px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--line)}
.datos b{display:block;font-size:clamp(30px,3.4vw,52px);color:var(--accent)}
.datos span{font-size:13px;color:var(--muted)}

/* Tarifas */
.planes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;gap:6px;padding:38px 30px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);transition:transform .45s var(--e)}
@media (hover:hover){.plan:hover{transform:translateY(-6px)}}
.plan.dest{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.plan .tag{top:-13px;left:28px;background:var(--text);color:var(--bg)}
.plan > b{font-size:18px}
.pp{font-size:clamp(52px,5vw,76px);margin:10px 0 18px}
.pp small{font-family:var(--fb);font-size:15px;opacity:.65;text-transform:none}
.plan ul{list-style:none;display:grid;gap:12px;margin-bottom:30px;flex:1}
.plan li{display:flex;gap:10px;align-items:center;opacity:.88}
.plan li svg{color:var(--accent);font-size:18px}
.plan.dest li svg{color:var(--ink)}
.plan.dest .b1{background:var(--ink);color:var(--accent)}
.plan.dest .b1::before{background:var(--bg)}

/* Reserva */
.reserva-g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(30px,5vw,90px);align-items:start}
.reserva{padding:32px;border-radius:calc(var(--radius) * .8);background:var(--bg);display:grid;gap:22px}
.dias{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.dias button,.horas button{border:1px solid var(--line);transition:background .25s,color .25s,transform .35s var(--e),border-color .25s}
.dias button{padding:12px 0;border-radius:calc(var(--radius) / 2);display:grid}
.dias button:hover,.horas button:not(:disabled):hover{border-color:var(--accent);transform:translateY(-2px)}
.dias small{color:var(--muted);font-size:12px}
.dias b{font-size:22px;font-family:var(--fd)}
.horas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.horas button{height:46px;border-radius:99px;font-size:14px;font-weight:500}
.horas button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.dias .on,.horas .on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.dias .on small{color:inherit;opacity:.75}
.res-ok{width:100%}

/* Pie con la marca en grande */
.ft{padding:clamp(70px,7vw,110px) 0 0;border-top:1px solid var(--line);background:var(--surface);overflow:hidden}
.ft-g{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}
.ft-lema{font-size:clamp(18px,1.6vw,24px);color:var(--text)!important;max-width:460px;line-height:1.4}
.ft p{color:var(--muted);font-size:14.5px;display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ft p span{color:var(--text);min-width:130px}
.ft h4{font-size:15px;font-weight:600;color:var(--accent);margin-bottom:14px}
.ft-g > div > a{display:block;color:var(--muted);margin-bottom:9px}
.soc{display:flex;gap:8px;margin-top:22px}
.soc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px;border:1px solid var(--line);transition:background .3s,color .3s,transform .4s var(--e)}
.soc a:hover{background:var(--accent);color:var(--ink);transform:translateY(-3px)}
.ft-marca{font-size:min(19vw,calc((100vw - 2 * var(--g)) / (var(--n,10) * .6)));line-height:.82;white-space:nowrap;padding:clamp(40px,5vw,80px) var(--g) 0;margin-bottom:-.12em;color:color-mix(in srgb,var(--text) 92%,var(--surface));overflow:hidden;text-overflow:clip}
.ft-b{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:22px;padding-bottom:26px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;position:relative;background:var(--surface)}
.wa-float{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -6px rgba(37,211,102,.55);z-index:25;transition:transform .35s var(--e)}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:30px;height:30px}
.wa-float::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:onda 2.4s infinite}
@keyframes onda{to{transform:scale(1.6);opacity:0}}
.mini .wa-float,.mini .t-toast{display:none}
.mini .kb img,.mini .pill i,.mini .ph{animation:none}
.mini .ph img{transition:opacity .3s}
.t-toast{position:fixed;left:50%;bottom:28px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--text);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:transform .45s var(--e),opacity .3s}
.t-toast.on{transform:translate(-50%,0);opacity:1}
.t-toast svg{color:var(--accent)}

/* Cinta "vista previa" cuando se abre suelta */
.ribbon{white-space:nowrap;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:35;display:flex;gap:10px;align-items:center;background:#111;color:#fff;font:600 13px system-ui,sans-serif;padding:8px 8px 8px 16px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ribbon a{background:#c8f560;color:#111;padding:10px 16px;border-radius:99px}

/* Ajustes por diseño */
[data-tema=filo] .cinta{background:var(--surface);color:var(--accent);border-block:1px solid var(--line)}
[data-tema=pulso] .cinta{position:relative;z-index:2}
[data-tema=pulso] .hero h1{font-size:clamp(64px,12vw,210px);line-height:.88}
[data-tema=lienzo] .cinta{background:transparent;color:var(--text);border-block:1px solid var(--line)}
[data-tema=lienzo] .ct span::after{content:"·";color:var(--accent);opacity:1}
[data-tema=kiosko] .ft-marca{color:var(--accent)}
[data-tema=calma] .par-img .ph{inset:clamp(20px,3vw,48px) var(--g) clamp(20px,3vw,48px) 0;border-radius:400px 400px var(--radius) var(--radius)}
[data-tema=calma] .sobre .par-img .ph{inset:clamp(20px,3vw,48px) 0 clamp(20px,3vw,48px) var(--g)}

@media (max-width:980px){
  .nl{display:none}
  .nv-menu{display:grid}
  .nv-cta{display:none}
  .nv-r{margin-left:auto}
  .hero.split,.par-sec,.reserva-g{grid-template-columns:minmax(0,1fr)}
  .hero.split .hv{order:-1;min-height:62vw}
  .mini .hero.split .hv{min-height:300px}
  .hero.split .hc{padding:44px var(--g) 64px}
  [data-tema=calma] .hero.split .hv .ph{inset:16px var(--g) 0;border-radius:300px 300px 0 0}
  .par-txt,.sobre .par-txt{padding:72px var(--g)}
  .par-img{min-height:78vw;order:-1}
  .info .mapa{order:2;min-height:80vw}
  .sobre .par-img{order:-1}
  [data-tema=calma] .par-img .ph,[data-tema=calma] .sobre .par-img .ph{inset:20px var(--g) 0;border-radius:300px 300px var(--radius) var(--radius)}
  .ops,.planes{grid-template-columns:minmax(0,1fr)}
  .ventajas{grid-template-columns:minmax(0,1fr)}
  .v,.v:first-child{border-left:0;border-top:1px solid var(--line);padding:22px 0}
  .v:first-child{border-top:0}
  .prods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gal{grid-template-columns:1fr 1fr;grid-template-rows:62vw 36vw 36vw}
  .g0{grid-row:auto}
  .ft-g{grid-template-columns:1fr 1fr}.ft-g > div:first-child{grid-column:span 2}
}
@media (max-width:560px){
  .sec{padding:76px 0}
  .nv .w{height:66px;gap:12px}
  .mnav{top:66px}
  .hero.img{padding-top:110px;min-height:clamp(560px,100svh,860px)}
  .mini .hero.img{min-height:760px}
  .hstats{flex-wrap:wrap;gap:10px 18px;font-size:13.5px;padding:16px var(--g)}
  .hscroll{display:none}
  .btns .b{flex:1 1 100%}
  .hb .btns{width:100%}
  .proys{grid-template-columns:1fr}
  .proy,.proy.ancho{grid-column:auto;height:92vw}
  .proy-i{flex-wrap:wrap;gap:6px 12px}
  .proy-i em{margin-left:0;flex-basis:100%;order:3;padding:0}
  .proy-i span{display:none}
  .prods{gap:10px}
  .pi{flex-direction:column;gap:0;padding-top:10px}
  .pi b{font-size:14px}
  .add{width:42px;height:42px;left:auto;right:8px;bottom:8px}
  .hv.wide{height:100vw}
  .horas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dias{grid-template-columns:repeat(3,minmax(0,1fr))}
  .reserva{padding:18px}
  .lg{font-size:20px}
  .op-sum b{font-size:40px}
  .gal{grid-template-rows:80vw 44vw 44vw;gap:4px}
  .ft-g{grid-template-columns:1fr}.ft-g > div:first-child{grid-column:auto}
  .badge{padding:10px 14px 10px 10px}.badge > svg{width:22px;height:22px}
  .datos div{padding:16px 10px}
  .li span{font-size:19px}
  [data-tema=pulso] .cinta{transform:none;margin:0}
}
