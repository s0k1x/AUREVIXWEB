<!-- Plantilla para Supabase → Authentication → Emails → «Magic link» y «Confirm signup».
     Asunto: Tu código de AurevixWeb: {{ .Token }}
     Se usa para entrar y para verificar el correo al crear la cuenta (no hay contraseñas). -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f2ee;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16161b">
  <tr><td align="center" style="padding:24px 12px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden">
      <tr><td style="background:#0c0c0e;padding:22px 28px">
        <img src="https://aurevixweb.es/icons/logo-a.png" width="32" height="32" alt="" style="vertical-align:middle;border:0">
        <span style="vertical-align:middle;margin-left:10px;color:#f3f1ea;font-size:17px;font-weight:700">AurevixWeb</span>
      </td></tr>
      <tr><td style="height:4px;background:#c8f560;font-size:0;line-height:0">&nbsp;</td></tr>
      <tr><td style="padding:30px 28px 10px">
        <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2">Tu código de acceso</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.55">Escribe este código en la web para entrar o para verificar tu correo. Caduca en 10 minutos.</p>
        <p style="margin:0 0 22px;padding:18px;background:#f6f8ef;border-radius:12px;text-align:center;font-size:34px;font-weight:700;letter-spacing:.3em">{{ .Token }}</p>
        <p style="margin:0 0 24px;font-size:13px;line-height:1.5;color:#86837c">Si no has pedido este código, ignora este correo: nadie puede entrar en tu cuenta sin él. No lo compartas con nadie; nunca te lo pediremos.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
