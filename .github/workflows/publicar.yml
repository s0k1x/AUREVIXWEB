# Publicar la web (copia minificada) en el repositorio público que sirve aurevixweb.es
# 1. Prepara dist/ con solo lo necesario y el JS/CSS minificado (scripts/publicar.mjs).
# 2. Prueba esa copia en ordenador y móvil (tests/pruebas.mjs): si algo falla, NO se publica.
# 3. La sube a s0k1x/aurevixweb-web (GitHub Pages). Así este repositorio, con el
#    código legible, puede ser privado.
# Necesita el secreto PUBLICAR_TOKEN (ver LEEME, sección 48). Sin él, solo prueba.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.PUBLICAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar herramientas
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.25.10 playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Preparar la copia minificada
        run: node scripts/publicar.mjs
      - name: Probar la copia que se va a publicar
        run: WEB_DIR="$GITHUB_WORKSPACE/dist" node tests/pruebas.mjs
      - name: Subir al repositorio público
        if: env.TOKEN != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PUBLICAR_TOKEN }}
          external_repository: s0k1x/aurevixweb-web
          publish_branch: main
          publish_dir: ./dist
          cname: aurevixweb.es
          commit_message: Publicación automática
