<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
  <title>Sin conexión · AurevixWeb</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0c0c0e;color:#f3f1ea;font-family:system-ui,-apple-system,sans-serif;text-align:center}
    .box{max-width:360px}
    .mark{width:64px;height:64px;margin:0 auto 24px;border-radius:18px;background:#c8f560;color:#0c0c0e;display:grid;place-items:center;font-size:30px;font-weight:800;transform:rotate(-6deg)}
    h1{font-size:26px;margin-bottom:10px;letter-spacing:-.02em}
    p{color:#a19f96;line-height:1.6;margin-bottom:28px}
    button{height:50px;padding:0 26px;border:0;border-radius:99px;background:#c8f560;color:#0c0c0e;font:inherit;font-weight:600;cursor:pointer}
  </style>
<script>/* Sin zoom (ni doble toque ni pellizco) */document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false})</script><style>html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}body{-webkit-touch-callout:none}</style></head>
<body>
  <div class="box">
    <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12"/></svg></div>
    <h1>Estás sin conexión</h1>
    <p>No hay internet ahora mismo. En cuanto vuelva la conexión podrás seguir viendo la web y pedir tu presupuesto.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
