<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vista previa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.pexels.com">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip;--e:cubic-bezier(.22,1,.36,1);--line:color-mix(in srgb,var(--text) 10%,transparent)}
body{background:var(--bg);color:var(--text);font-family:var(--fb);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:1em;height:1em;flex:none}
.w{max-width:1200px;margin:0 auto;padding:0 24px}
h1,h2,h3,.lg,.pp,.datos b,.op-sum b{font-family:var(--fd);font-weight:var(--hw);text-transform:var(--tt);letter-spacing:-.015em;line-height:1.02}
[data-tema=filo] :is(h1,h2,.lg),[data-tema=pulso] :is(h1,h2,.lg){letter-spacing:.01em}
h1 em,h2 em{font-style:italic;color:var(--accent)}
.h2{font-size:clamp(32px,5vw,56px);max-width:760px}
.sh{margin-bottom:44px}
.sec{padding:104px 0}
.sec.tight{padding:48px 0}
.sec.alt{background:var(--surface)}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.kick::before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}

/* Aparición al hacer scroll */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--e),transform .9s var(--e)}
.rv.in,.mini .rv,.sin-anim .rv{opacity:1;transform:none}
.mini .rv{transition:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.kb img{animation:none!important}.cinta .ct{animation:none!important}}

/* Botones */
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 28px;border-radius:var(--radius);font-weight:600;font-size:15px;white-space:nowrap;position:relative;overflow:hidden;isolation:isolate;
  transition:transform .35s var(--e),box-shadow .35s var(--e),background .3s,color .3s}
.b svg{font-size:18px;transition:transform .35s var(--e)}
.b:hover svg{transform:translateX(4px)}
.b:active{transform:scale(.97)}
.b1{background:var(--accent);color:var(--ink);box-shadow:0 10px 30px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.b1:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px color-mix(in srgb,var(--accent) 80%,transparent)}
.b1::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--e)}
.b1:hover::after{transform:translateX(120%)}
.b2{border:1.5px solid color-mix(in srgb,var(--text) 25%,transparent)}
.b2:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.b.sm{height:42px;padding:0 20px;font-size:14px}
[data-tema=calma] .b,[data-tema=brasa] .b,[data-tema=kiosko] .b{border-radius:999px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}

/* Fotos: degradado de color mientras carga o si falla */
.ph{position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--radius);
  background:radial-gradient(circle at 25% 25%,color-mix(in srgb,var(--accent) 45%,var(--surface)),transparent 55%),linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--surface)),color-mix(in srgb,var(--text) 30%,var(--bg)))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s var(--e),transform 1.1s var(--e)}
.ph img.ok{opacity:1}
.kb img{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16) translate(-1.5%,-1%)}}

/* Navegación */
.nv{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);transition:background .4s,border-color .4s,color .4s}
.nv.over{position:fixed;left:0;right:0;background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff}
.nv.over.solid,.nv.over.menu{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line);color:var(--text)}
.nv .w{display:flex;align-items:center;gap:30px;height:74px}
.lg{font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nl{display:flex;gap:28px;margin-left:auto;font-size:15px;font-weight:500}
.nl a{opacity:.72;position:relative;transition:opacity .25s}
.nl a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--e)}
.nl a:hover{opacity:1}.nl a:hover::after{transform:scaleX(1)}
.nv-r{display:flex;align-items:center;gap:10px}
.cart{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;border:1px solid var(--line)}
.cart i{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--ink);font:700 11px/20px var(--fb);font-style:normal;text-align:center}
.cart.bump{animation:bump .5s var(--e)}
@keyframes bump{40%{transform:scale(1.18)}}
.nv-menu{display:none;width:44px;height:44px;border-radius:50%;place-items:center;font-size:22px;border:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.mnav{position:fixed;inset:74px 0 auto;z-index:29;display:grid;gap:4px;padding:16px 24px 26px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.35);
  transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .45s var(--e),opacity .3s}
.mnav.open{transform:none;opacity:1;pointer-events:auto}
.mnav a:not(.b){padding:14px 0;font-size:20px;font-family:var(--fd);border-bottom:1px solid var(--line)}
.mnav .b{margin-top:14px}

/* Hero con foto a pantalla completa */
.hero{position:relative;overflow:hidden}
.hero h1{font-size:clamp(48px,8.2vw,112px)}
.hero p{font-size:clamp(16px,1.5vw,19px);color:var(--muted);max-width:540px;margin-top:24px}
.hero.img{min-height:clamp(600px,96vh,940px);display:flex;align-items:flex-end;color:#fff;padding:140px 0 90px}
.mini .hero.img{min-height:780px}
.hbg{position:absolute;inset:0}
.hbg .ph{border-radius:0}
.hbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 35%,rgba(0,0,0,.35) 60%,color-mix(in srgb,var(--bg) 96%,transparent) 100%),radial-gradient(ellipse at 15% 85%,rgba(0,0,0,.55),transparent 60%)}
.hero.img .hc{position:relative;z-index:1;width:100%}
.hero.img h1{max-width:900px;text-shadow:0 4px 40px rgba(0,0,0,.35)}
.hero.img p{color:rgba(255,255,255,.82)}
.hero.img .b2{border-color:rgba(255,255,255,.4);color:#fff}
.hero.img .b2:hover{background:#fff;color:#111}
.hmeta{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.hmeta span{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;font-weight:500}
.hmeta svg{color:var(--accent);font-size:17px}
.hscroll{position:absolute;z-index:1;left:50%;margin-left:-26px;bottom:30px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:20px;animation:baja 2.4s var(--e) infinite}
@keyframes baja{50%{transform:translateY(8px)}}
/* Entrada del hero */
.hc > *{animation:sube 1s var(--e) both}
.hc > :nth-child(2){animation-delay:.08s}.hc > :nth-child(3){animation-delay:.16s}.hc > :nth-child(4){animation-delay:.24s}.hc > :nth-child(5){animation-delay:.32s}
@keyframes sube{from{opacity:0;transform:translateY(30px)}}
.mini .hc > *{animation:none}

/* Hero partido con foto y etiquetas flotantes */
.hero.split{padding:64px 0 96px}
.hero.split .w{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.hero.split .hc{min-width:0}
.hv{position:relative;aspect-ratio:4/5;min-width:0}
.hv > .ph{box-shadow:0 40px 80px -30px rgba(0,0,0,.35)}
.hero.split .hv::before{content:"";position:absolute;inset:auto -18px -18px 18px;height:70%;border-radius:var(--radius);background:var(--accent);opacity:.18;z-index:-1}
.badge{position:absolute;z-index:2;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--text);padding:14px 18px 14px 14px;border-radius:calc(var(--radius) + 4px);box-shadow:0 24px 50px -16px rgba(0,0,0,.3);border:1px solid var(--line);animation:flota 6s ease-in-out infinite}
.badge > svg{font-size:20px;width:42px;height:42px;padding:11px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.badge b{display:block;font-size:16px;line-height:1.2}
.badge span{font-size:13px;color:var(--muted)}
.bd0{left:-34px;bottom:44px}
.bd1{right:-26px;top:40px;animation-delay:-3s}
@keyframes flota{50%{transform:translateY(-10px)}}
.mini .badge{animation:none}

/* Hero editorial */
.hero.big{padding:80px 0 0}
.hero.big h1{font-size:clamp(56px,11.5vw,168px);max-width:1150px;letter-spacing:-.035em}
.hb{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-top:18px}
.hb .btns{margin-top:0}
.hv.wide{aspect-ratio:21/9;margin-top:64px;max-width:none}
.hv.wide .ph{border-radius:0}
.par img{transform:scale(1.12);animation:none;transition:opacity .8s var(--e);will-change:transform}

/* Cinta en movimiento */
.cinta{overflow:hidden;background:var(--accent);color:var(--ink);padding:18px 0;border-block:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.ct{display:flex;width:max-content;animation:cinta 38s linear infinite}
.ct span{display:inline-flex;align-items:center;gap:30px;padding-right:30px;font-family:var(--fd);font-weight:var(--hw);text-transform:var(--tt);font-size:clamp(20px,2.4vw,30px);white-space:nowrap;line-height:1}
.ct span::after{content:"✦";font-size:.6em;opacity:.55}
@keyframes cinta{to{transform:translateX(-33.333%)}}

/* Lista de precios */
.lista-g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:64px;align-items:start}
.lista{max-width:820px}
.lista.multi{max-width:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.lista.multi .grupo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 24px 22px;overflow:hidden}
.g-img{margin:-14px -24px 18px;height:190px}
.g-img .ph{border-radius:0}
.grupo h3{font-size:24px;color:var(--accent);margin-bottom:6px}
.li{display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);transition:padding .35s var(--e)}
.li:hover{padding-left:8px}
.li b{font-weight:600;font-size:16.5px}
.li small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:2px}
.li i{flex:1;border-bottom:1.5px dotted color-mix(in srgb,var(--text) 25%,transparent);transform:translateY(-4px)}
.li span{font-family:var(--fd);font-size:21px;color:var(--accent);white-space:nowrap}
.lista-img{position:sticky;top:100px;aspect-ratio:4/5}
.etq{position:absolute;left:18px;bottom:18px;display:inline-flex;align-items:center;gap:8px;background:var(--bg);color:var(--text);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.etq svg{color:var(--accent)}

/* Galería */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:250px 250px;gap:14px}
.g{position:relative;overflow:hidden;border-radius:var(--radius);cursor:zoom-in}
.g0{grid-row:span 2}
.g .ph{border-radius:0}
.g::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.45));opacity:0;transition:opacity .5s}
.g-ic{position:absolute;z-index:1;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:18px;transform:scale(.6);opacity:0;transition:transform .5s var(--e),opacity .4s}
@media (hover:hover){.g:hover img{transform:scale(1.07)}.g:hover::after{opacity:1}.g:hover .g-ic{transform:none;opacity:1}}

/* Opiniones */
.op-h{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:44px}
.op-h .sh{margin-bottom:0}
.op-sum{display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:calc(var(--radius) + 6px);background:var(--bg);border:1px solid var(--line)}
.op-sum b{font-size:48px;line-height:1}
.op-sum small{display:block;color:var(--muted);font-size:13px}
.stars{color:#f5b301;letter-spacing:3px;font-size:18px}
.stars.sm{font-size:12px;letter-spacing:1px}
.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.op{position:relative;padding:34px 30px 28px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:26px;transition:transform .5s var(--e),box-shadow .5s var(--e)}
@media (hover:hover){.op:hover{transform:translateY(-6px);box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}}
.q{font-size:30px;color:var(--accent);opacity:.9}
.op blockquote{font-size:18.5px;line-height:1.5;font-weight:500}
.op figcaption{display:flex;align-items:center;gap:12px}
.op figcaption b{display:block;font-size:15px}
.op figcaption small{color:var(--muted);font-size:12.5px}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--accent);color:var(--ink)}
.av1{background:color-mix(in srgb,var(--accent) 30%,var(--text));color:var(--bg)}
.av2{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--text)}

/* Info */
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center}
.info .sh{margin-bottom:22px}
.estado{margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-size:13.5px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulso 2s infinite}
.pill.si{color:#16a34a;background:rgba(22,163,74,.12)}
.pill.no{color:#dc2626;background:rgba(220,38,38,.1)}
@keyframes pulso{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.horario div{display:flex;justify-content:space-between;gap:16px;padding:14px 12px;margin:0 -12px;border-bottom:1px solid var(--line);border-radius:10px}
.horario span{color:var(--muted)}
.horario b{font-weight:600;text-align:right}
.horario .hoy{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:transparent}
.horario .hoy span{color:var(--text);font-weight:600}
.horario .hoy span::after{content:" · hoy";color:var(--accent)}
.dir{display:flex;align-items:center;gap:8px;margin-top:22px;font-weight:600}
.dir svg{color:var(--accent)}
.info .btns{margin-top:22px}
.mapa{aspect-ratio:1/1;max-height:520px;border-radius:var(--radius);position:relative;overflow:hidden;background:color-mix(in srgb,var(--surface) 75%,var(--accent));
  background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:56px 56px;border:1px solid var(--line)}
.calle{position:absolute;background:color-mix(in srgb,var(--bg) 85%,transparent);box-shadow:0 0 0 1px var(--line)}
.c1{left:-10%;right:-10%;top:52%;height:22px;transform:rotate(-12deg)}
.c2{top:-10%;bottom:-10%;left:38%;width:16px;transform:rotate(18deg)}
.c3{left:-10%;right:-10%;top:22%;height:10px;transform:rotate(8deg);opacity:.7}
.pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);font-size:52px;color:var(--accent);filter:drop-shadow(0 10px 14px rgba(0,0,0,.3));animation:salta 2.6s var(--e) infinite}
.pin svg{fill:color-mix(in srgb,var(--accent) 30%,transparent)}
@keyframes salta{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-115%)}}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:22px;height:8px;margin-left:-11px;border-radius:50%;background:rgba(0,0,0,.25)}
.mapa-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,14px);background:var(--bg);color:var(--text);font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px;box-shadow:0 10px 24px -8px rgba(0,0,0,.3);white-space:nowrap}

/* CTA con foto */
.cta{position:relative;overflow:hidden;background:var(--accent);color:var(--ink);border-radius:calc(var(--radius) * 1.5);padding:96px 40px;text-align:center;isolation:isolate}
.cta.conimg{color:#fff}
.cta-bg{position:absolute!important;inset:0;z-index:-2;border-radius:0}
.cta.conimg::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.65))}
.cta-in{display:flex;flex-direction:column;align-items:center;gap:14px}
.cta h2{font-size:clamp(34px,5.5vw,68px);max-width:820px}
.cta p{opacity:.85;font-size:18px;margin-bottom:14px}
.cta:not(.conimg) .b1{background:var(--ink);color:var(--accent)}
@media (hover:hover){.cta.conimg:hover .cta-bg img{transform:scale(1.05)}}

/* Ventajas */
.ventajas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.v{display:flex;gap:16px;align-items:center;padding:24px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);transition:transform .4s var(--e)}
@media (hover:hover){.v:hover{transform:translateY(-4px)}.v:hover .ve{transform:rotate(-8deg) scale(1.08)}}
.ve{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);transition:transform .45s var(--e)}
.v b{display:block;margin-bottom:2px;font-size:16.5px}
.v p{color:var(--muted);font-size:14px}

/* Productos */
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.prod{position:relative;background:var(--surface);border-radius:calc(var(--radius) + 4px);padding:10px;border:1px solid var(--line);transition:transform .5s var(--e),box-shadow .5s var(--e)}
@media (hover:hover){.prod:hover{transform:translateY(-6px);box-shadow:0 30px 60px -30px rgba(0,0,0,.3)}.prod:hover img{transform:scale(1.06)}}
.prod-img{position:relative;aspect-ratio:1}
.tag{position:absolute;top:12px;left:12px;z-index:2;background:var(--text);color:var(--bg);font-style:normal;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px}
.pi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 8px 8px}
.pi > div{min-width:0}
.pi b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi span{color:var(--muted);font-weight:500}
.add{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:20px;display:grid;place-items:center;transition:transform .35s var(--e),background .3s}
.add:hover{transform:rotate(90deg)}
.add.ok{background:#16a34a;color:#fff;transform:none}

/* Proyectos */
.proys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.proy{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;border-radius:var(--radius)}
.proy.ancho{grid-column:span 2;aspect-ratio:21/9}
.proy .ph{border-radius:0}
.proy-i{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:14px;padding:28px;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7))}
.proy-i b{font-family:var(--fd);font-size:clamp(24px,3vw,38px);font-weight:400;line-height:1.1}
.proy-i small{opacity:.8;margin-left:auto;white-space:nowrap}
.proy-i span{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-size:20px;transform:rotate(-45deg) scale(.7);opacity:0;transition:transform .5s var(--e),opacity .4s}
@media (hover:hover){.proy:hover img{transform:scale(1.05)}.proy:hover .proy-i span{transform:rotate(-45deg);opacity:1}}

/* Sobre */
.sobre{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center}
.sobre:not(.conimg){grid-template-columns:1fr}
.sobre-img{aspect-ratio:4/5;position:relative}
.sobre-img::after{content:"";position:absolute;right:-16px;bottom:-16px;width:42%;height:42%;border:2px solid var(--accent);border-radius:var(--radius);z-index:-1}
.sobre .sh{margin-bottom:22px}
.txt{font-size:19px;color:var(--muted);max-width:560px}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:34px}
.datos div{padding:22px 16px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--line)}
.datos b{display:block;font-size:clamp(28px,3vw,40px);color:var(--accent)}
.datos span{font-size:13px;color:var(--muted)}

/* Tarifas */
.planes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;gap:6px;padding:34px 28px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);transition:transform .45s var(--e)}
@media (hover:hover){.plan:hover{transform:translateY(-6px)}}
.plan.dest{background:var(--accent);color:var(--ink);border-color:var(--accent);transform:scale(1.03);box-shadow:0 40px 80px -30px color-mix(in srgb,var(--accent) 60%,transparent)}
.plan .tag{top:-13px;left:26px;background:var(--text);color:var(--bg)}
.plan > b{font-size:18px}
.pp{font-size:62px;margin:8px 0 16px}
.pp small{font-family:var(--fb);font-size:15px;opacity:.65;text-transform:none}
.plan ul{list-style:none;display:grid;gap:12px;margin-bottom:28px;flex:1}
.plan li{display:flex;gap:10px;align-items:center;opacity:.85}
.plan li svg{color:var(--accent);font-size:18px}
.plan.dest li svg{color:var(--ink)}
.plan.dest .b1{background:var(--ink);color:var(--accent)}

/* Reserva */
.reserva{max-width:720px;padding:30px;border-radius:calc(var(--radius) * .8);background:var(--bg);border:1px solid var(--line);display:grid;gap:22px;box-shadow:0 30px 60px -40px rgba(0,0,0,.3)}
.dias{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.dias button,.horas button{border:1px solid var(--line);transition:background .25s,color .25s,transform .3s var(--e),border-color .25s}
.dias button{padding:12px 0;border-radius:calc(var(--radius) / 2);display:grid}
.dias button:hover,.horas button:not(:disabled):hover{border-color:var(--accent);transform:translateY(-2px)}
.dias small{color:var(--muted);font-size:12px}
.dias b{font-size:22px;font-family:var(--fd)}
.horas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.horas button{height:46px;border-radius:99px;font-size:14px;font-weight:500}
.horas button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.dias .on,.horas .on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.dias .on small{color:inherit;opacity:.75}
.res-ok{width:100%}

/* Pie */
.ft{padding:72px 0 40px;border-top:1px solid var(--line);background:var(--surface)}
.ft-g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
.ft .lg{display:block;font-size:28px;margin-bottom:12px}
.ft p{color:var(--muted);font-size:14.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px;max-width:360px}
.ft p span{color:var(--text);min-width:120px}
.ft h4{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.ft-g > div > a{display:block;color:var(--muted);margin-bottom:8px}
.soc{display:flex;gap:8px;margin-top:18px}
.soc a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;border:1px solid var(--line);transition:background .3s,color .3s,transform .35s var(--e)}
.soc a:hover{background:var(--accent);color:var(--ink);transform:translateY(-3px)}
.ft-b{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.wa-float{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -6px rgba(37,211,102,.55);z-index:25;transition:transform .35s var(--e)}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:30px;height:30px}
.wa-float::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:onda 2.4s infinite}
@keyframes onda{to{transform:scale(1.6);opacity:0}}
.mini .wa-float,.mini .t-toast,.mini .hscroll{display:none}
.mini .kb img,.mini .pin,.mini .pill i{animation:none}
.mini .ph img{transition:opacity .4s}
.t-toast{position:fixed;left:50%;bottom:28px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--text);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:transform .45s var(--e),opacity .3s}
.t-toast.on{transform:translate(-50%,0);opacity:1}
.t-toast svg{color:var(--accent)}

/* Cinta "vista previa" cuando se abre suelta */
.ribbon{white-space:nowrap;position:fixed;left:50%;top:86px;transform:translateX(-50%);z-index:35;display:flex;gap:10px;align-items:center;background:#111;color:#fff;font:600 13px system-ui,sans-serif;padding:8px 8px 8px 16px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ribbon a{background:#c8f560;color:#111;padding:7px 14px;border-radius:99px}

/* Ajustes por tema */
[data-tema=filo] .cinta{background:var(--surface);color:var(--accent)}
[data-tema=pulso] .cinta{transform:rotate(-2deg) scale(1.04);margin:-20px 0 0;position:relative;z-index:2}
[data-tema=pulso] .hero h1{font-size:clamp(60px,11vw,150px);line-height:.92}
[data-tema=lienzo] .cinta{background:transparent;color:var(--text);border-color:var(--line)}
[data-tema=lienzo] .ct span::after{content:"—";color:var(--accent);opacity:1}
[data-tema=calma] .ph,[data-tema=calma] .hv > .ph{border-radius:200px 200px var(--radius) var(--radius)}
[data-tema=calma] .g .ph,[data-tema=calma] .hbg .ph{border-radius:0}

@media (max-width:980px){
  .nl{display:none}
  .nv-menu{display:grid}
  .nv-cta{display:none}
  .nv-r{margin-left:auto}
  .hero.split .w,.info,.sobre,.lista-g{grid-template-columns:minmax(0,1fr);gap:40px}
  .hero.split{padding:32px 0 72px}
  .hero.split .hv{aspect-ratio:4/3.4;order:-1}
  [data-tema=calma] .hv > .ph{border-radius:160px 160px var(--radius) var(--radius)}
  .bd0{left:12px;bottom:-22px}.bd1{right:12px;top:16px}
  .ops,.ventajas,.planes{grid-template-columns:minmax(0,1fr)}
  .plan.dest{transform:none}
  .prods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gal{grid-template-columns:1fr 1fr;grid-template-rows:240px 160px 160px}
  .g0{grid-row:auto;grid-column:span 2}
  .lista-img{position:relative;top:0;aspect-ratio:16/10;order:-1}
  .ft-g{grid-template-columns:1fr 1fr}.ft-g > div:first-child{grid-column:span 2}
  .sobre-img{aspect-ratio:4/3.4}
}
@media (max-width:560px){
  .w{padding:0 18px}
  .sec{padding:76px 0}
  .sh{margin-bottom:32px}
  .nv .w{height:64px;gap:12px}
  .mnav{top:64px}
  .hero.img{padding:120px 0 70px;min-height:clamp(560px,92vh,820px)}
  .mini .hero.img{min-height:720px}
  .hero p{font-size:16px}
  .hscroll{display:none}
  .btns .b{flex:1 1 100%}
  .hb .btns{width:100%}
  .proys{grid-template-columns:1fr}
  .proy,.proy.ancho{grid-column:auto;aspect-ratio:4/3.4}
  .proy-i{flex-wrap:wrap;padding:20px}
  .proy-i small{margin-left:0;flex-basis:100%;order:2}
  .proy-i span{display:none}
  .prods{gap:10px}
  .prod{padding:6px}
  .pi{padding:12px 4px 4px}
  .pi b{font-size:14px}
  .add{width:36px;height:36px;font-size:17px}
  .hv.wide{aspect-ratio:4/3.6;margin-top:44px}
  .horas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dias{grid-template-columns:repeat(3,minmax(0,1fr))}
  .reserva{padding:18px}
  .cta{padding:72px 22px}
  .lg{font-size:20px}
  .op-sum b{font-size:38px}
  .gal{grid-template-rows:220px 140px 140px;gap:10px}
  .ft-g{grid-template-columns:1fr}.ft-g > div:first-child{grid-column:auto}
  .badge{padding:10px 14px 10px 10px}.badge > svg{width:36px;height:36px;padding:9px}
  .datos div{padding:16px 10px}
  .li span{font-size:18px}
  .ribbon{top:auto;bottom:90px}
  [data-tema=pulso] .cinta{transform:none;margin:0}
}
</style>
</head>
<body>
<div id="site"></div>
<script type="module">
  import { pintarPlantilla } from './js/plantillas.js';
  const q = new URLSearchParams(location.search);
  pintarPlantilla(document.getElementById('site'), q.get('t'), { nombre: q.get('n'), color: q.get('c'), mini: q.get('m') === '1' });
  if (window.top === window) {
    const r = document.createElement('div');
    r.className = 'ribbon';
    r.innerHTML = 'Vista previa de diseño <a href="index.html#disenos">Volver</a>';
    document.body.appendChild(r);
  }
</script>
</body>
</html>
