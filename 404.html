<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · AurevixWeb</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png">
  <link rel="icon" type="image/png" sizes="144x144" href="/icons/favicon-144.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
  <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="/fuentes/fuentes.css">
  <style>
    :root{--bg:#0c0c0e;--text:#f3f1ea;--muted:#a19f96;--line:rgba(255,255,255,.09);--accent:#c8f560;--ink:#0c0c0e;color-scheme:dark}
    @media (prefers-color-scheme:light){:root{--bg:#f6f5f0;--text:#16161b;--muted:#5d5b55;--line:rgba(20,20,26,.1);--accent:#457509;--ink:#fff;color-scheme:light}}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
    #publica{position:fixed;inset:0}
    .pub-marco{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    .pub-carga{position:absolute;inset:0;display:grid;place-items:center}
    .pub-carga i{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:gira .8s linear infinite}
    @keyframes gira{to{transform:rotate(360deg)}}
    .p404{display:none;position:absolute;inset:0;place-items:center;padding:24px;text-align:center}
    .es-404 .p404{display:grid}
    .es-404 .pub-carga{display:none}
    .p404 img{display:block;width:min(46vw,200px);height:auto;margin:0 auto 8px;pointer-events:none}
    @media (max-height:560px){.p404 img{display:none}}
    .p404 h1{display:block;margin-top:0;font-weight:700;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(34px,7vw,56px);letter-spacing:-.03em;line-height:1.05;margin-bottom:12px}
    .p404 p{color:var(--muted);font-size:17px;max-width:42ch;margin:0 auto 26px;line-height:1.5}
    .p404 a,.pub-error button{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border-radius:99px;background:var(--accent);color:var(--ink);font:600 15px/1 inherit;text-decoration:none;border:0;cursor:pointer}
    .pub-error{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;padding:24px;text-align:center}
    .pub-error b{font-size:22px}.pub-error p{color:var(--muted);margin:0 0 14px}
    .pub-aviso{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:12px;background:#16161b;color:#f3f1ea;font-size:14px;line-height:1.4;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:opacity .2s ease,transform .25s cubic-bezier(.23,1,.32,1)}
    .pub-aviso.ver{opacity:1;transform:translate(-50%,0)}
    @media (prefers-reduced-motion:reduce){.pub-carga i{animation-duration:2s}}
  </style>
  <script>/* Versión nueva de la web: se recarga una vez para no mezclar piezas de dos versiones */try{var sw=navigator.serviceWorker;if(sw&&sw.controller){window.__swVigila=1;sw.addEventListener('controllerchange',function(){if(window.__swRecargado||document.documentElement.classList.contains('es-web'))return;window.__swRecargado=1;try{sessionStorage.setItem('tm_act','1')}catch(e){}location.reload()})}}catch(e){}</script>
</head>
<body>
  <main id="publica">
    <div class="pub-carga" aria-label="Cargando"><i></i></div>
    <div class="p404">
      <div>
        <img src="/img/poses/error-404.webp" alt="" width="477" height="491" decoding="async">
        <h1>Esta página no existe</h1>
        <p>Puede que el enlace esté mal escrito o que la web ya no esté publicada.</p>
        <a href="/">Ir a AurevixWeb</a>
      </div>
    </div>
  </main>
  <noscript><style>.pub-carga{display:none}.p404{display:grid}</style></noscript>
  <script type="module" src="/js/portada/publica.js"></script>
</body>
</html>
